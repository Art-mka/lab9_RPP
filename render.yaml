# render.yaml
services:
  # Staging окружение
  - type: web
    name: animal-shelter-staging
    runtime: image
    repo: https://github.com/YOUR_USERNAME/YOUR_REPO_NAME
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: animal_shelter.settings
      - key: DEBUG
        value: "False"
      - key: RENDER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: animal-shelter-db-staging
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "animal-shelter-staging.onrender.com,localhost,127.0.0.1"
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: |
      python manage.py migrate
      gunicorn animal_shelter.wsgi:application --bind 0.0.0.0:10000

  # Production окружение
  - type: web
    name: animal-shelter-production
    runtime: image
    repo: https://github.com/YOUR_USERNAME/YOUR_REPO_NAME
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: animal_shelter.settings
      - key: DEBUG
        value: "False"
      - key: RENDER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: animal-shelter-db-production
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "animal-shelter-production.onrender.com,localhost,127.0.0.1"
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: |
      python manage.py migrate
      gunicorn animal_shelter.wsgi:application --bind 0.0.0.0:10000

databases:
  - name: animal-shelter-db-staging
    plan: free
    databaseName: animal_shelter
    user: postgres

  - name: animal-shelter-db-production
    plan: free
    databaseName: animal_shelter
    user: postgres