name: Django CI/CD

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: animal_user
          POSTGRES_PASSWORD: animal_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Static code analysis with Pylint
      run: |
        pip install pylint pylint-django
        pylint --load-plugins=pylint_django --django-settings-module=animal_shelter.settings animals/

    - name: Run migrations
      env:
        DATABASE_URL: postgres://animal_user:animal_password@localhost:5432/test_db
      run: |
        python manage.py migrate

    - name: Run tests
      env:
        DATABASE_URL: postgres://animal_user:animal_password@localhost:5432/test_db
        DEBUG: "True"
        SECRET_KEY: test-secret-key
      run: |
        python manage.py test animals -v 2

  deploy-staging:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to Render Staging
      uses: johnbeynon/render-deploy@v1.0.0
      with:
        service-id: ${{ secrets.RENDER_STAGING_SERVICE_ID }}
        api-key: ${{ secrets.RENDER_API_KEY }}

  deploy-production:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to Render Production
      uses: johnbeynon/render-deploy@v1.0.0
      with:
        service-id: ${{ secrets.RENDER_PRODUCTION_SERVICE_ID }}
        api-key: ${{ secrets.RENDER_API_KEY }}