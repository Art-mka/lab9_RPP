{% extends 'base.html' %}

{% block content %}
<h2>Вход</h2>
<form method="post">
    {% csrf_token %}
    {% for field in form %}
        <label>{{ field.label }}</label>
        {{ field }}
    {% endfor %}
    <button type="submit" class="btn">Войти</button>
</form>
<p><a href="{% url 'register' %}">Нет аккаунта? Регистрация</a></p>
{% endblock %}
