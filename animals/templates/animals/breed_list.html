{% extends 'base.html' %}

{% block content %}
<h2>Породы</h2>
<a href="{% url 'breed_create' %}" class="btn">Добавить</a>

<table>
    <thead><tr><th>ID</th><th>Название</th><th>Вид</th><th></th></tr></thead>
    <tbody>
        {% for b in breeds %}
        <tr>
            <td>{{ b.id }}</td>
            <td>{{ b.name }}</td>
            <td>{{ b.species.name }}</td>
            <td>
                <a href="{% url 'breed_update' b.pk %}" class="btn btn-orange" style="padding: 4px 8px;">Редактировать</a>
                <a href="{% url 'breed_delete' b.pk %}" class="btn btn-red" style="padding: 4px 8px;">Удалить</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="4" style="text-align: center;">Нет пород</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
