{% extends 'base.html' %}

{% block content %}
<h2>Виды животных</h2>
<a href="{% url 'species_create' %}" class="btn">Добавить</a>

<table>
    <thead><tr><th>ID</th><th>Название</th><th></th></tr></thead>
    <tbody>
        {% for s in species %}
        <tr>
            <td>{{ s.id }}</td>
            <td>{{ s.name }}</td>
            <td>
                <a href="{% url 'species_update' s.pk %}" class="btn btn-orange" style="padding: 4px 8px;">Редактировать</a>
                <a href="{% url 'species_delete' s.pk %}" class="btn btn-red" style="padding: 4px 8px;">Удалить</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="3" style="text-align: center;">Нет видов</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
