{% extends 'base.html' %}

{% block content %}
<h2>{% if form.instance.pk %}Редактировать вид{% else %}Добавить вид{% endif %}</h2>
<form method="post">
    {% csrf_token %}
    {% for field in form %}
        <label>{{ field.label }}</label>
        {{ field }}
    {% endfor %}
    <button type="submit" class="btn">Сохранить</button>
    <a href="{% url 'species_list' %}" class="btn btn-red">Отмена</a>
</form>
{% endblock %}
