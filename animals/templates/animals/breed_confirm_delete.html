{% extends 'base.html' %}

{% block content %}
<div style="text-align: center; padding: 40px;">
    <h2 style="color: black;">Удалить породу "{{ breed.name }}"?</h2>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-red">Удалить</button>
        <a href="{% url 'breed_list' %}" class="btn">Отмена</a>
    </form>
</div>
{% endblock %}
